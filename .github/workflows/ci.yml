# Builds and tests the backend (JUnit + Testcontainers + Modulith verification) and both front-ends.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test (PostgreSQL via Testcontainers)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: angular-client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
